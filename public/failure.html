<!DOCTYPE html>
<!-- The live customer screen: fetches /api/failure/:id and renders the money-state message. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where's my money? — payment status</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --surface-page:   #f9f9f7;
    --surface-card:   #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --ring:           rgba(11,11,11,0.10);
    --status-good:    #0ca30c;
    --status-warning: #fab219;
    --lane-silent:    #2a78d6;
    --recovery-bg:    color-mix(in srgb, #2a78d6 8%, var(--surface-card));
    --recovery-border:color-mix(in srgb, #2a78d6 30%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-page: #0d0d0d; --surface-card: #1a1a19;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --hairline: #2c2c2a; --ring: rgba(255,255,255,0.10);
      --lane-silent: #3987e5;
      --recovery-bg: color-mix(in srgb, #3987e5 14%, var(--surface-card));
      --recovery-border: color-mix(in srgb, #3987e5 40%, transparent);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-page: #0d0d0d; --surface-card: #1a1a19;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --hairline: #2c2c2a; --ring: rgba(255,255,255,0.10);
    --lane-silent: #3987e5;
    --recovery-bg: color-mix(in srgb, #3987e5 14%, var(--surface-card));
    --recovery-border: color-mix(in srgb, #3987e5 40%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    background: var(--surface-page); color: var(--text-primary);
    max-width: 560px; margin: 32px auto; padding: 0 16px;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .badge {
    display: inline-block; font-family: "Archivo", sans-serif;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em;
    padding: 3px 9px; border-radius: 999px; margin-bottom: 12px;
    background: color-mix(in srgb, var(--status-warning) 22%, var(--surface-card));
    border: 1px solid color-mix(in srgb, var(--status-warning) 55%, transparent);
    color: color-mix(in srgb, var(--status-warning) 65%, var(--text-primary));
  }
  h1 { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 20px; }
  .amount { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--text-secondary); margin-top: -14px; margin-bottom: 20px; }
  .qa { margin-bottom: 18px; }
  .qa dt { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 3px; margin-top: 14px; }
  .qa dd { margin: 0; }
  .tracker { margin: 24px 0; padding: 16px 0 0; list-style: none; border-top: 1px solid var(--hairline); }
  .tracker li { display: flex; gap: 10px; padding: 8px 0; align-items: flex-start; }
  .mark {
    flex: none; width: 20px; height: 20px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .mark.done { background: var(--status-good); color: #fff; }
  .mark.active { background: var(--lane-silent); color: #fff; }
  .mark.pending { background: var(--hairline); color: var(--text-muted); }
  .mark.unknown { background: var(--status-warning); color: #3d2b00; }
  .mark.skipped { background: var(--surface-card); border: 1px solid var(--hairline); color: var(--text-muted); }
  .tracker .label { font-weight: 600; font-size: 14px; }
  .tracker .note { font-size: 12.5px; color: var(--text-secondary); }
  .recovery {
    margin-top: 24px; padding: 14px 16px; border-radius: 10px;
    background: var(--recovery-bg); border: 1px solid var(--recovery-border);
  }
  .recovery .rationale { font-size: 13.5px; margin-bottom: 12px; }
  .recovery-action {
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: 14px;
    background: var(--lane-silent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; width: 100%;
  }
  .recovery-action:disabled { opacity: 0.6; cursor: default; }
  .recovery-status { font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; }
  .recovery-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .poll-indicator { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); margin: -8px 0 12px; }
  .poll-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--status-warning); animation: poll-pulse 1.2s ease-in-out infinite; }
  @keyframes poll-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .demo-controls { margin: 0 0 20px; padding: 10px 12px; border: 1px dashed var(--hairline); border-radius: 8px; }
  .demo-upgrade-btn {
    font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 12.5px;
    background: transparent; color: var(--text-secondary); border: 1px solid var(--hairline);
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
    max-width: 100%; white-space: normal; text-align: left; line-height: 1.4;
  }
  .demo-upgrade-btn:disabled { opacity: 0.6; cursor: default; }
  .demo-upgrade-status { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .err { color: #d03b3b; }
  .ref { font-family: "IBM Plex Mono", monospace; }
</style>
</head>
<body>
  <div id="app">Loading…</div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const STATUS_MARK = { done: '✓', active: '●', pending: '○', unknown: '?', skipped: '–' };

    function el(tag, attrs = {}, children = []) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
      }
      for (const c of [].concat(children)) e.appendChild(c);
      return e;
    }

    function render(m) {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (m.source === 'demo') {
        app.appendChild(el('div', { class: 'badge', text: 'SIMULATED — DEMO DATA' }));
      }

      app.appendChild(el('h1', { text: m.headline }));
      app.appendChild(el('div', { class: 'amount', text: `Amount: ${m.amount}` }));
      if (m.state === 'CONFIRMING') {
        app.appendChild(el('div', { class: 'poll-indicator' }, [
          el('span', { class: 'poll-dot' }),
          el('span', { text: 'Watching for a status update from your bank…' }),
        ]));
        app.appendChild(buildDemoUpgradeControl(m.id));
      }

      const qa = el('dl', { class: 'qa' });
      const rows = [
        ['Did my money leave?', m.questions.didMyMoneyLeave],
        ['Is it coming back?', m.questions.isItComingBack],
        ['Should I pay again right now?', m.questions.shouldIPayAgainNow],
        ['How do I still get what I wanted?', m.questions.howDoIStillGetWhatIWanted],
      ];
      for (const [q, a] of rows) {
        qa.appendChild(el('dt', { text: q }));
        qa.appendChild(el('dd', { text: a }));
      }
      app.appendChild(qa);

      const tracker = el('ul', { class: 'tracker' });
      for (const step of m.tracker) {
        const mark = el('span', { class: `mark ${step.status}`, text: STATUS_MARK[step.status] || '?' });
        const text = el('div', {}, [
          el('div', { class: 'label', text: step.label }),
          el('div', { class: 'note', text: step.note }),
        ]);
        tracker.appendChild(el('li', {}, [mark, text]));
      }
      app.appendChild(tracker);

      if (m.reference) {
        app.appendChild(el('p', { text: 'Reference: ' }, [el('span', { class: 'ref', text: m.reference })]));
      }

      const rec = el('div', { class: 'recovery' }, [
        el('div', { class: 'rationale', text: m.recovery.rationale }),
      ]);
      rec.appendChild(buildRecoveryAction(m));
      app.appendChild(rec);
    }

    // Demo-only control: fires the REAL confirming-poller (via the existing
    // /api/demo/upgrade-confirming endpoint -- see src/api/demoUpgrade.js)
    // against the row currently on screen, so a recording doesn't have to
    // wait for the real 5-minute poll cycle. Only ever shown on a CONFIRMING
    // screen. Does not re-render anything itself -- the setInterval already
    // running from watchForUpdate() picks up the change and re-renders on
    // its own, same as it would for a real upgrade with no button involved.
    function buildDemoUpgradeControl(id) {
      const btn = el('button', { class: 'demo-upgrade-btn', type: 'button', text: 'Simulate bank confirmation (demo only — production uses the background poller)' });
      const status = el('div', { class: 'demo-upgrade-status' });

      btn.addEventListener('click', async function () {
        btn.disabled = true;
        status.textContent = 'Requesting confirmation from the bank (simulated)…';
        try {
          const r = await fetch('/api/demo/upgrade-confirming', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: id }),
          });
          const body = await r.json();
          if (!r.ok) {
            status.textContent = `Could not upgrade: ${body.error || r.status}`;
            btn.disabled = false;
            return;
          }
          status.textContent = 'Confirmed — waiting for the page to pick it up…';
        } catch (e) {
          status.textContent = `Could not reach the service: ${e.message}`;
          btn.disabled = false;
        }
      });

      return el('div', { class: 'demo-controls' }, [btn, status]);
    }

    // Turns the recovery engine's decision into an action: a FRESH order via
    // /create-order (never a capture of the failed payment's funds -- that
    // money was never captured in the first place, and auto-reverses on its
    // own), then Checkout re-opened for it. Reads ONLY m.recovery (method,
    // switchMethod) -- nothing here re-decides anything recovery.js already
    // decided.
    //
    // The engine's method is a RECOMMENDATION, never a restriction. An
    // earlier version hard-restricted Checkout to a single method
    // (config.display.blocks + show_default_blocks:false) when method was
    // 'upi' -- on an account where UPI isn't enabled, that's a dead end
    // ("No appropriate payment method found"), which defeats the entire
    // point of a recovery path. Checkout is now ALWAYS opened with every
    // method available; the recommendation is surfaced only as copy, which
    // can never trap the customer regardless of what's enabled on the
    // account. (A "soft prioritise, don't hide" Razorpay config exists in
    // principle, but the exact syntax could not be confirmed with the
    // confidence this already-once-burned feature needs -- not worth
    // risking a second dead end for a cosmetic ordering win.)
    //
    // m.recovery.method is 'upi' or 'same' (recovery.js never returns a bare
    // 'card' as a target). 'same' means "retry whatever method the customer
    // used" -- but the ORIGINAL method is never persisted (see
    // failureLookup.js: `method: null`), so there's nothing to name even as
    // a recommendation; the neutral label covers this honestly.
    function buildRecoveryAction(m) {
      const recommendsUpi = m.recovery.method === 'upi';
      const label = recommendsUpi ? 'Pay again — UPI recommended' : 'Try another payment method';
      const btn = el('button', { class: 'recovery-action', type: 'button', text: label });
      const status = el('div', { class: 'recovery-status' });
      const hint = recommendsUpi
        ? el('div', { class: 'recovery-hint', text: 'We recommend UPI for this — every payment method is still available.' })
        : null;

      btn.addEventListener('click', async function () {
        btn.disabled = true;
        status.textContent = 'Creating a fresh order…';
        let order;
        try {
          // Send the failed payment's own id (and order id, if any) so the
          // merchant can trace this fresh order back to what it's
          // recovering -- Razorpay notes metadata, not a real link between
          // orders. This is still a standalone order; nothing here reuses
          // or captures the failed payment's funds.
          const r = await fetch('/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              originalPaymentId: m.id,
              originalOrderId: m.orderId || undefined,
            }),
          });
          order = await r.json();
          if (!r.ok) {
            status.textContent = `Could not start a new payment: ${order.error || r.status}`;
            btn.disabled = false;
            return;
          }
        } catch (e) {
          status.textContent = `Could not reach the service: ${e.message}`;
          btn.disabled = false;
          return;
        }
        status.textContent = '';

        const options = {
          key: order.keyId,
          order_id: order.orderId,
          amount: order.amount,
          currency: order.currency,
          name: 'Test Store',
          description: 'Test Product — ₹1,499 (fresh payment, not a retry of the failed one)',
          handler: function () {
            status.textContent = '✓ Payment successful.';
          },
          modal: {
            ondismiss: function () { btn.disabled = false; },
          },
          theme: { color: '#3399cc' },
        };
        // Deliberately no method restriction here (see the note above the
        // function) -- Checkout always opens with every method available.

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          console.log('FAILED (payment.failed) response:', response);
          const paymentId = response.error && response.error.metadata && response.error.metadata.payment_id;
          btn.disabled = false;
          if (paymentId) {
            status.textContent = 'That attempt failed too — loading its status…';
            setTimeout(function () {
              location.href = '/failure.html?id=' + encodeURIComponent(paymentId) + '&from=checkout';
            }, 600);
          } else {
            status.textContent = 'That attempt failed.';
          }
        });
        rzp.open();
      });

      const wrap = el('div', {}, [btn, status]);
      if (hint) wrap.appendChild(hint);
      return wrap;
    }

    // Real webhook delivery is async and can trail the browser landing here
    // (checkout.html redirects on the client-side payment.failed event, which
    // fires before Razorpay's server-to-server webhook necessarily has). Only
    // retry a 404 when we arrived via that redirect (?from=checkout) — a
    // direct link to a genuinely missing id should 404 immediately, not stall.
    const RETRY_INTERVAL_MS = 700;
    const MAX_RETRIES = 8; // ~5.6s total

    // CONFIRMING is the one state that resolves itself: the background
    // confirming-poller (src/confirming-poller.js) rechecks Razorpay and
    // upgrades the stored row on its own. This just watches for that --
    // plain re-fetch + re-render, nothing pushed from the server. Stops the
    // moment the state leaves CONFIRMING, or if the tab is hidden (no point
    // polling a screen nobody's looking at).
    const POLL_INTERVAL_MS = 3000;
    let pollTimer = null;

    function watchForUpdate(id) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (document.hidden) return;
        try {
          const res = await fetch(`/api/failure/${encodeURIComponent(id)}`);
          if (!res.ok) return; // transient hiccup -- next tick retries, screen stays as-is
          const fresh = await res.json();
          if (fresh.state !== 'CONFIRMING') {
            clearInterval(pollTimer);
            pollTimer = null;
            render(fresh);
          }
        } catch (e) {
          // Same as above: leave the last good render on screen and retry.
        }
      }, POLL_INTERVAL_MS);
    }

    async function load() {
      const params = new URLSearchParams(location.search);
      const fromCheckout = params.get('from') === 'checkout';
      const app = document.getElementById('app');
      let id = params.get('id');

      // ?demo=confirming is the repeatable CONFIRMING demo link: every
      // fresh page load mints its own new CONFIRMING row (through the real
      // webhook pipeline -- see src/api/demoConfirming.js) instead of
      // pointing at one fixed id that's spent the first time someone
      // actually clicks the demo button. Reopening the link always lands on
      // a brand-new row.
      if (!id && params.get('demo') === 'confirming') {
        app.innerHTML = '';
        app.appendChild(el('p', {}, [el('span', { text: 'Setting up a fresh demo failure…' })]));
        try {
          const r = await fetch('/api/demo/fresh-confirming', { method: 'POST' });
          const body = await r.json();
          if (!r.ok) {
            app.innerHTML = '';
            app.appendChild(el('p', { class: 'err', text: `Could not set up the demo: ${body.error || r.status}` }));
            return;
          }
          id = body.id;
        } catch (e) {
          app.innerHTML = '';
          app.appendChild(el('p', { class: 'err', text: `Could not reach the service: ${e.message}` }));
          return;
        }
      }

      if (!id) {
        app.innerHTML = '';
        app.appendChild(el('p', { class: 'err', text: 'No ?id= given. Open this page as /failure.html?id=<payment-or-demo-id>, or /failure.html?demo=confirming for a fresh live demo.' }));
        return;
      }

      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        try {
          const res = await fetch(`/api/failure/${encodeURIComponent(id)}`);
          if (res.ok) {
            const m = await res.json();
            render(m);
            if (m.state === 'CONFIRMING') watchForUpdate(id);
            return;
          }
          if (res.status === 404 && fromCheckout && attempt < MAX_RETRIES) {
            app.innerHTML = '';
            app.appendChild(el('p', { class: 'err', text: `Waiting for the webhook to arrive… (${attempt + 1}/${MAX_RETRIES})` }));
            await new Promise((r) => setTimeout(r, RETRY_INTERVAL_MS));
            continue;
          }
          const body = await res.json().catch(() => ({}));
          app.innerHTML = '';
          app.appendChild(el('p', { class: 'err', text: `${res.status}: ${body.error || 'failed to load'}` }));
          return;
        } catch (e) {
          app.innerHTML = '';
          app.appendChild(el('p', { class: 'err', text: `Could not reach the service: ${e.message}` }));
          return;
        }
      }
    }
    load();
  </script>
</body>
</html>
