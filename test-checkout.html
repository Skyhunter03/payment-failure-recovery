<!DOCTYPE html>
<!-- Minimal Razorpay test-mode checkout, one product, order-based flow via /create-order. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Checkout — ₹1,499</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { font-size: 18px; padding: 12px 24px; cursor: pointer; }
    pre { background: #111; color: #0f0; padding: 16px; border-radius: 8px;
          white-space: pre-wrap; word-break: break-word; margin-top: 24px; }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Test Store — one product</h1>
  <p><strong>Test Product</strong> — ₹1,499.00</p>
  <button id="pay">Pay ₹1,499</button>
  <p class="muted">Razorpay <strong>test mode</strong>. Success and failure both log the full
    response object below and to the browser console.</p>
  <pre id="log">(response objects will appear here)</pre>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // Order-based flow: fetch a real order from /create-order (server-side,
    // uses RAZORPAY_KEY_ID + RAZORPAY_KEY_SECRET) before opening Checkout, so
    // every attempt — success or failure — carries a real order_id. Without
    // this, payments fail at payment_initiation with no order context and no
    // proper failure webhook fires. MUST be opened via same-origin
    // http://<host>/checkout (not the raw file) so fetch('/create-order') works.
    const logEl = document.getElementById('log');
    let firstLog = true;
    function log(label, obj) {
      console.log(label, obj);
      if (firstLog) { logEl.textContent = ''; firstLog = false; }
      logEl.textContent += label + '\n' + JSON.stringify(obj, null, 2) + '\n\n';
    }

    document.getElementById('pay').addEventListener('click', async function () {
      let order;
      try {
        const r = await fetch('/create-order', { method: 'POST' });
        order = await r.json();
        if (!r.ok) { log('CREATE-ORDER failed:', order); return; }
      } catch (e) {
        log('CREATE-ORDER error (is the service reachable?):', { message: String(e) });
        return;
      }
      log('order created:', order);

      const rzp = new Razorpay({
        key: order.keyId,
        order_id: order.orderId,
        amount: order.amount,     // paise -> ₹1,499.00
        currency: order.currency,
        name: 'Test Store',
        description: 'Test Product — ₹1,499',
        handler: function (response) {
          log('SUCCESS (handler) response:', response);
        },
        modal: {
          ondismiss: function () { log('DISMISSED (modal closed by user):', {}); }
        },
        theme: { color: '#3399cc' }
      });
      // Full failure object: response.error has code, description, reason,
      // source, step, and metadata (payment_id, order_id). Auto-navigate to
      // the customer screen for THIS payment — failure.html itself retries
      // briefly if the webhook hasn't arrived yet (real delivery is async and
      // can trail this client-side event by a moment).
      rzp.on('payment.failed', function (response) {
        log('FAILED (payment.failed) response:', response);
        const paymentId = response.error && response.error.metadata && response.error.metadata.payment_id;
        if (paymentId) {
          setTimeout(function () {
            location.href = '/failure.html?id=' + encodeURIComponent(paymentId) + '&from=checkout';
          }, 600);
        }
      });
      rzp.open();
    });
  </script>
</body>
</html>
